name: API Docker Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "packages/types/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/api-docker-deploy.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: travel-companion-backend

jobs:
  quality_checks:
    name: API Testing
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_companion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travel_companion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_companion_test
      JWT_ACCESS_SECRET: test_access_secret_1234567890
      JWT_REFRESH_SECRET: test_refresh_secret_1234567890
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply DB migrations for API tests
        run: pnpm --filter @repo/db db:deploy

      - name: Run API typecheck
        run: pnpm --filter @repo/api typecheck

      - name: Run API tests
        run: pnpm --filter @repo/api test

  release_api:
    name: Semantic Release (API)
    runs-on: ubuntu-latest
    needs: quality_checks
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Semantic Release for apps/api
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: apps/api
          tag_format: api-v${version}
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @semantic-release/npm@12.0.1
            @semantic-release/github@11.0.1

  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: release_api
    if: needs.release_api.outputs.new_release_published == 'true'
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
      image_ref: ${{ steps.version.outputs.image_ref }}
      image_name: ${{ steps.version.outputs.image_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync to latest main after release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Use semantic-release version for image tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.release_api.outputs.new_release_version }}"
          IMAGE_REF="${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${IMAGE_TAG}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.version.outputs.image_ref }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.version.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.ref == 'refs/heads/main' && needs.build_and_push.result == 'success'
    env:
      IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
      IMAGE_NAME: travel-companion-backend
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: SSH deploy with docker compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_NAME,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="$HOME/travel-companion/apps/api"
            fi

            if [ -d "$DEPLOY_PATH/.git" ]; then
              git -C "$DEPLOY_PATH" fetch origin main
              git -C "$DEPLOY_PATH" checkout main
              git -C "$DEPLOY_PATH" pull --ff-only origin main
            fi

            cd "$DEPLOY_PATH"

            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

            export IMAGE_TAG
            export DOCKERHUB_USERNAME
            docker compose pull api
            docker compose up -d --remove-orphans
