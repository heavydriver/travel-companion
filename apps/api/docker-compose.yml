services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/travel-companion-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3000
      OTEL_SERVICE_NAME: travel-companion-api
      SERVICE_VERSION: ${IMAGE_TAG:-latest}
    expose:
      - "3000"
    networks:
      - backend_net

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend_net
      - signoz-net

volumes:
  caddy_data:
  caddy_config:

networks:
  backend_net:
  signoz-net:
    external: true
